name: chat-web-cloud

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '20m'
        max-file: '30'

services:
    web:
        image: ${IMAGE:?IMAGE is required}
        container_name: chat-web-cloud-nginx
        restart: unless-stopped
        logging: *default-logging
        init: true
        ports:
            - '80:80'
            - '443:443'
            # 基础设施 TCP 端口继续由云端 Nginx stream 转发到开发机。
            - '3306:3306'
            - '6379:6379'
            - '5672:5672'
            - '9092:9092'
            - '15672:15672'
            - '172.18.100.12:8848:8848'
            - '172.18.100.12:9848:9848'
        volumes:
            # 云端 Nginx 配置由基础设施部署维护，避免 Manager 发布覆盖其他域名入口。
            - ${NGINX_CONFIG_PATH:-./nginx.conf}:/etc/nginx/nginx.conf:ro
            - ${LETSENCRYPT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
        networks:
            - cloud
        healthcheck:
            test: ['CMD-SHELL', "wget --no-check-certificate --header='Host: chat.lisfes.cn' -qO- https://127.0.0.1/health | grep -qx healthy"]
            interval: 15s
            timeout: 5s
            retries: 6
            start_period: 10s
        mem_limit: 128m
        mem_reservation: 32m
        cpus: 0.5
        pids_limit: 128

networks:
    cloud:
        external: true
        name: chat-web-cloud
