name: chat-web-service

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '20m'
        max-file: '5'

services:
    base-manager:
        image: ${IMAGE:?IMAGE is required}
        container_name: chat-web-base-manager
        restart: unless-stopped
        logging: *default-logging
        init: true
        environment:
            TZ: ${TZ:-Asia/Shanghai}
        ports:
            - '${HTTPS_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:8443'
        volumes:
            - tls:/etc/nginx/tls:ro
        networks:
            - infrastructure
        stop_grace_period: 10s

networks:
    infrastructure:
        external: true
        name: ${DOCKER_NETWORK:-chat-web-infrastructure}

volumes:
    tls:
        external: true
        name: chat-web-base-manager-tls
